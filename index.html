<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f5f3">
  <title>Дневник смен</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172923;
      --muted: #72827b;
      --line: #e7ede9;
      --green: #176b50;
      --mint: #e9f5ee;
      --paper: #ffffff;
      --canvas: #f2f6f3;
      --blue: #527eaa;
      --shadow: 0 18px 50px #173d2b0b, 0 2px 8px #173d2b08;
    }
    * { box-sizing: border-box }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% -20%, #e3f0e8 0, transparent 44%), var(--canvas);
      color: var(--ink);
      font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { width: min(100% - 36px, 760px); margin: 42px auto 72px }
    header { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 24px }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0 }
    .brand-mark { display: grid; place-items: center; width: 44px; height: 44px; flex: 0 0 44px; border-radius: 15px; background: #dceee3; color: var(--green); font-size: 23px; font-weight: 750 }
    h1 { margin: 0; font-size: 23px; font-weight: 740; letter-spacing: -.7px; line-height: 1.15 }
    .sub { color: var(--muted); font-size: 13px; margin-top: 5px }
    .date-controls { display: flex; align-items: center; gap: 7px; padding: 5px; border: 1px solid #e7ede9; border-radius: 16px; background: #ffffffc9; box-shadow: 0 4px 14px #183b2a08 }
    .datebox { width: 156px; border: 0; border-radius: 10px; padding: 8px 5px; background: transparent; color: var(--ink); font: inherit; font-size: 14px; font-weight: 620 }
    button, select, input { font: inherit }
    button { cursor: pointer }
    button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid #91c8ae; outline-offset: 2px }
    .nav-button { display: grid; place-items: center; width: 34px; height: 34px; border: 0; border-radius: 11px; background: transparent; color: #5f7469; font-size: 20px; transition: background .18s, color .18s }
    .nav-button:hover { background: var(--mint); color: var(--green) }
    .card { margin-bottom: 16px; border: 1px solid #e7ede9; border-radius: 22px; background: var(--paper); box-shadow: var(--shadow) }
    #summary { padding: 12px }
    .net-panel { display: flex; align-items: center; justify-content: space-between; min-height: 150px; overflow: hidden; position: relative; padding: 23px 26px; border-radius: 17px; background: linear-gradient(118deg, #153f34 0%, #1d6149 62%, #267557 100%); color: white }
    .net-panel:after { content: ""; position: absolute; width: 210px; height: 210px; right: 45px; top: -138px; border: 1px solid #ffffff16; border-radius: 50%; box-shadow: 0 0 0 22px #ffffff08, 0 0 0 45px #ffffff06 }
    .eyebrow { color: #d2e4d9; font-size: 11px; font-weight: 720; letter-spacing: .11em; text-transform: uppercase }
    .net { margin-top: 5px; font-size: clamp(34px, 7vw, 43px); font-weight: 760; letter-spacing: -1.6px; line-height: 1.12 }
    .net small { color: #d0e5d8; font-size: 22px; font-weight: 560; letter-spacing: -.4px }
    .net-caption { margin-top: 7px; color: #c4ddce; font-size: 12px; text-transform: capitalize }
    .hero-mark { display: grid; place-items: center; z-index: 1; width: 58px; height: 58px; border: 1px solid #ffffff2e; border-radius: 20px; background: #ffffff12; color: #e1f3e7; font-size: 25px; font-weight: 650; backdrop-filter: blur(8px) }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0 }
    .metric { position: relative; min-width: 0; overflow: hidden; padding: 15px 16px; border: 1px solid #edf1ee; border-radius: 15px; background: #fbfcfb }
    .metric:before { content: ""; position: absolute; top: 0; right: 0; left: 0; height: 3px; background: #6baa85 }
    .metric:nth-child(2):before { background: #d78276 }
    .metric:nth-child(3):before { background: #82a5c6 }
    .metric .eyebrow { color: var(--muted); font-size: 10px; letter-spacing: .08em }
    .value { margin-top: 5px; font-size: 19px; font-weight: 720; letter-spacing: -.45px; white-space: nowrap }
    .value.negative { color: #b65049 }
    .payment-block { padding: 14px 16px 12px; border: 1px solid #edf1ee; border-radius: 15px; background: #fbfcfb }
    .payment-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 11px; color: var(--muted); font-size: 12px; font-weight: 650 }
    .payment-heading strong { color: #52645b; font-size: 11px; font-weight: 620 }
    .payrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
    .pay-item { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; min-width: 0; padding: 11px 12px; border: 1px solid #edf1ee; border-radius: 12px; background: white }
    .pay-label { display: flex; align-items: center; gap: 7px; color: #687970; font-size: 11px; font-weight: 630 }
    .pay-item strong { color: #22372d; font-size: 16px; font-weight: 740; font-variant-numeric: tabular-nums }
    .pay-item small { color: #8a9890; font-size: 10px }
    .dot { display: inline-block; width: 8px; height: 8px; flex: 0 0 8px; border-radius: 50%; padding: 0; border: 0; box-shadow: none }
    .dot.cash { background: #55a783 }
    .dot.bank-card { background: var(--blue) }
    .bar { display: flex; height: 7px; overflow: hidden; margin-top: 12px; border-radius: 8px; background: #e9efeb }
    .bar span:first-child { background: #55a783 }
    .bar span:last-child { background: var(--blue) }
    .section-title { display: flex; align-items: center; justify-content: space-between; margin: 28px 3px 11px }
    h2 { margin: 0; font-size: 17px; font-weight: 730; letter-spacing: -.3px }
    .count { padding: 5px 10px; border: 1px solid #e3ebe5; border-radius: 99px; background: #ffffffa8; color: #65776d; font-size: 11px; font-weight: 650 }
    #trips { padding: 5px 20px }
    .trip { display: flex; align-items: center; gap: 13px; margin: 0 -8px; padding: 14px 8px; border-bottom: 1px solid #edf1ee; border-radius: 13px; transition: background .18s }
    .trip:hover { background: #f7faf8 }
    .trip:last-child { border-bottom-color: transparent }
    .time-range { display: flex; align-items: center; justify-content: center; gap: 6px; width: 126px; flex: 0 0 126px; padding: 9px 7px; border: 1px solid #edf1ee; border-radius: 11px; background: #f8faf8; color: #52645b; font-size: 11px; font-weight: 690; font-variant-numeric: tabular-nums; white-space: nowrap }
    .time-arrow { color: #9aaa9f; font-size: 11px }
    .details { flex: 1; min-width: 0 }
    .payment { display: inline-flex; align-items: center; gap: 7px; padding: 5px 9px; border-radius: 99px; font-size: 11px; font-weight: 680 }
    .payment.cash { background: #edf7f1; color: #347759 }
    .payment.bank-card { background: #edf3f9; color: #456d96 }
    .commission { margin-top: 5px; color: var(--muted); font-size: 11px }
    .amount { padding: 8px 10px; border-radius: 10px; background: #f2f7f3; color: #24382e; font-size: 13px; font-weight: 760; font-variant-numeric: tabular-nums; white-space: nowrap }
    .empty, .error { padding: 34px 12px; color: var(--muted); text-align: center }
    .error { color: #a7473d }
    .add-card { overflow: hidden }
    .add-card summary { display: flex; align-items: center; justify-content: space-between; cursor: pointer; list-style: none; padding: 17px 20px; color: #33463c; font-size: 13px; font-weight: 680 }
    .add-card summary::-webkit-details-marker { display: none }
    .add-card summary:after { content: "+"; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; background: var(--mint); color: var(--green); font-size: 19px; font-weight: 450; transition: transform .2s }
    .add-card[open] summary:after { content: "−"; transform: rotate(180deg) }
    .trip-form { padding: 18px 20px 20px; border-top: 1px solid var(--line) }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px }
    .field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 11px; font-weight: 650 }
    .field input, .field select { width: 100%; min-height: 43px; border: 1px solid #e1e9e3; border-radius: 11px; padding: 9px 11px; background: #fff; color: var(--ink); font-size: 13px; transition: border-color .15s, box-shadow .15s }
    .field input:focus, .field select:focus { border-color: #7bb294; box-shadow: 0 0 0 3px #dcefe3; outline: 0 }
    .form-actions { display: flex; align-items: center; gap: 12px; margin-top: 16px }
    .primary { min-height: 42px; border: 0; border-radius: 11px; padding: 10px 15px; background: var(--green); color: white; font-size: 12px; font-weight: 700; box-shadow: 0 4px 10px #176b5022; transition: background .18s, transform .18s }
    .primary:hover { transform: translateY(-1px); background: #125b43 }
    .primary:disabled { opacity: .6; cursor: wait }
    .form-message { color: var(--muted); font-size: 11px }
    .form-message.error { padding: 0; color: #a7473d; text-align: left }
    .form-message.success { color: var(--green) }
    @media (prefers-reduced-motion: reduce) { *, *:before, *:after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important } }
    @media (max-width: 560px) {
      main { width: min(100% - 24px, 440px); margin: 22px auto 42px }
      header { align-items: flex-start; flex-direction: column; gap: 14px; margin-bottom: 17px }
      .date-controls { align-self: stretch; justify-content: space-between }
      .datebox { width: auto; flex: 1; text-align: center }
      .net-panel { min-height: 138px; padding: 20px }
      .hero-mark { width: 48px; height: 48px; border-radius: 16px }
      .stats { grid-template-columns: 1fr 1fr; gap: 8px }
      .metric { padding: 12px }
      .value { font-size: 17px }
      #trips { padding: 3px 15px }
      .trip { gap: 10px; padding: 14px 0 }
      .time-range { width: 112px; flex-basis: 112px; gap: 4px; font-size: 10px }
      .trip { gap: 9px }
      .amount { padding: 7px 8px; font-size: 12px }
    }
    @media (max-width: 360px) {
      .net-panel { padding: 17px }
      .payrow { font-size: 11px }
      .time-range { width: 98px; flex-basis: 98px; padding-inline: 4px }
      .trip-form { padding: 15px }
      .form-grid { gap: 10px }
    }
  </style>
</head>
<body>
<main>
  <header><div class="brand"><div class="brand-mark" aria-hidden="true">↗</div><div><h1>Дневник смен</h1><div class="sub">Доходы и поездки за день</div></div></div><div class="date-controls"><button class="nav-button" id="previous" type="button" aria-label="Предыдущий день">‹</button><input class="datebox" id="day" type="date" aria-label="Выбрать дату"><button class="nav-button" id="next" type="button" aria-label="Следующий день">›</button></div></header>
  <section class="card" id="summary"><div class="empty">Загрузка…</div></section>
  <div class="section-title"><h2>Поездки</h2><span class="count" id="count"></span></div>
  <section class="card" id="trips"><div class="empty">Загрузка…</div></section>
  <details class="card add-card" id="add-trip"><summary>Добавить поездку</summary>
    <form class="trip-form" id="trip-form">
      <div class="form-grid">
        <div class="field"><label for="start">Начало</label><input id="start" name="start" type="datetime-local" required></div>
        <div class="field"><label for="end">Окончание</label><input id="end" name="end" type="datetime-local" required></div>
        <div class="field"><label for="amount">Сумма, ₸</label><input id="amount" name="amount" type="number" min="1" step="1" inputmode="numeric" placeholder="2400" required></div>
        <div class="field"><label for="commission">Комиссия, ₸</label><input id="commission" name="commission" type="number" min="0" step="1" inputmode="numeric" placeholder="360" required></div>
        <div class="field"><label for="payment">Способ оплаты</label><select id="payment" name="payment"><option value="cash">Наличные</option><option value="card">Карта</option></select></div>
      </div>
      <div class="form-actions"><button class="primary" id="save-trip" type="submit">Сохранить поездку</button><output class="form-message" id="form-message" aria-live="polite"></output></div>
    </form>
  </details>
</main>
<script src="/app.js" defer></script>
</body>
</html>
